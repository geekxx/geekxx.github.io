name: Build and publish recipe previews

permissions:
  contents: read
  pages: write
  issues: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'recipes/**'
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build previews
        run: |
          . .venv/bin/activate
          python tools/build_preview.py

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site_preview
          publish_branch: gh-pages

      - name: Comment PR with preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const previewBase = `https://${owner}.github.io/${repo}`;
            const indexUrl = `${previewBase}/index.html`;
            const body = `Preview built for this PR: ${indexUrl}\n\nYou can also view the specific recipe pages from the index.`;
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
